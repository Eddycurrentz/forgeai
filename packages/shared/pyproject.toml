[project]
name = "forgeai-shared"
version = "0.1.0"
description = "Shared types and constants for ForgeAI"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
